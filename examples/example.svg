<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="402pt" height="252pt" viewBox="0.00 0.00 402.00 252.00">
<style type="text/css">/* CSS for family trees */

/* Node boxes */

.node-box {
    fill: #efefef;
    stroke: #444;
    stroke-width: 1.2;

    rx: 6px;
    ry: 6px;
}

/* Text */

.node text {
    fill: #222;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
}

/* Birth/Death year (the second line) a bit less prominent */
.node text:nth-of-type(2) {
    font-size: 71%;
    opacity: 0.7;
}

/* Connector lines */

.edge path {
    stroke: #666;
    stroke-width: 1.4;
    fill: none;
}

/* Arrowheads */

.edge polygon {
    fill: #666;
    stroke: #666;
}
</style><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(4 248)">
